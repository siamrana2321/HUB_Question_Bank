<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>HUB CSE Question Bank</title>
  <link rel="stylesheet" href="questionbank.css">
  <script src="questionbank.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header>
    
  <img class="department-logo" src="image/CSE.png" alt="Dept. Logo">
  <div class="logo">
    CSE</div>
  <h1>Department of CSE Question Bank, HUB</h1>
  <p>Previous examination question papers — Dept. CSE — Hamdard University Bangladesh</p>
</header>

<main class="container">

  <div class="search-wrapper">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search semester or question paper..."
      autocomplete="off"
    >
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>

  <div id="status" class="status">
    <div class="spinner"></div>
    <span>Loading question bank...</span>
  </div>
  
  <div id="app"></div>

</main>

<footer>
  @ Question Bank • Computer Science & Engineering, HUB • Maintained for students • Developed by CSE Student Community
</footer>



</body>
</html>
